name: android-apk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install buildozer + cython + sh
        run: |
          python -m pip install --upgrade pip
          pip install cython sh buildozer

      - name: Install build deps + LT_SYS_SYMBOL_USCORE shim for libffi
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y libtool autoconf automake libtool-bin python3-venv
          if ! grep -rq "LT_SYS_SYMBOL_USCORE" /usr/share/aclocal/ 2>/dev/null; then
            echo "Adding LT_SYS_SYMBOL_USCORE shim"
            printf 'AC_DEFUN([LT_SYS_SYMBOL_USCORE], [AC_PROG_CC])\nAC_DEFUN([LT_SYS_DLSYM_USCORE], [AC_PROG_CC])\n' > /usr/share/aclocal/lt-underscore.m4
            echo "shim written"
          fi

      - name: Clone P4A master + patch build.py (venv pip corruption fix)
        run: |
          set -e
          P4A_DIR=$HOME/.buildozer/android/platform/python-for-android
          mkdir -p $HOME/.buildozer/android/platform
          if [ ! -d "$P4A_DIR" ]; then
            git clone --depth 1 --branch master https://github.com/kivy/python-for-android.git "$P4A_DIR"
          fi
          python3 patch_p4a.py "$P4A_DIR"

      - name: Point spec at patched P4A
        run: |
          P4A_ABS=$(echo "$HOME/.buildozer/android/platform/python-for-android" | sed "s|^$HOME|$HOME|")
          grep -q "p4a.source_dir" buildozer.spec 2>/dev/null || \
            sed -i "s|^p4a.branch = master|p4a.branch = master\np4a.source_dir = $HOME/.buildozer/android/platform/python-for-android|" buildozer.spec
          echo "spec now:"; cat buildozer.spec

      - name: Build debug APK (retries for transient network)
        env:
          PIP_RETRIES: "10"
          PIP_TIMEOUT: "60"
        run: |
          try=1
          while [ $try -le 3 ]; do
            echo "=== buildozer attempt $try ==="
            if buildozer android debug; then
              echo "BUILD_OK"; break
            fi
            echo "attempt $try failed, retrying in 20s..."; sleep 20
            try=$((try+1))
          done
          if ! ls bin/*.apk >/dev/null 2>&1; then
            echo "NO APK after retries"; ls -la bin/ 2>&1; exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gameauto-apk
          path: bin/*.apk
