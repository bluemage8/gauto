# Build KivyMD Android APK on GitHub Actions
name: android-apk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install buildozer + cython + sh
        run: |
          python -m pip install --upgrade pip
          pip install cython sh buildozer

      - name: Install build deps + provide LT_SYS_SYMBOL_USCORE macro for libffi
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y libtool autoconf automake libtool-bin
          # libtool >= 2.4.7 removed LT_SYS_SYMBOL_USCORE; libffi's configure.ac still uses it.
          # Provide a no-op shim in the system aclocal dir (auto-included by autoreconf).
          if ! grep -rq "LT_SYS_SYMBOL_USCORE" /usr/share/aclocal/ 2>/dev/null; then
            echo "Adding LT_SYS_SYMBOL_USCORE shim"
            cat > /usr/share/aclocal/lt-underscore.m4 <<'M4EOF'
AC_DEFUN([LT_SYS_SYMBOL_USCORE], [AC_PROG_CC])
AC_DEFUN([LT_SYS_DLSYM_USCORE], [AC_PROG_CC])
M4EOF
            echo "shim written"
          fi

      - name: Build debug APK (with retries for transient 502 network errors)
        env:
          PIP_RETRIES: "10"
          PIP_TIMEOUT: "60"
          PIP_DEFAULT_TIMEOUT: "60"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
        run: |
          try=1
          while [ $try -le 3 ]; do
            echo "=== buildozer attempt $try ==="
            if buildozer android debug; then
              echo "BUILD_OK"
              break
            fi
            echo "buildozer attempt $try failed, retrying in 20s..."
            sleep 20
            try=$((try+1))
          done
          if ! ls bin/*.apk >/dev/null 2>&1; then
            echo "=== NO APK after retries ==="
            ls -la bin/ 2>&1
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gameauto-apk
          path: bin/*.apk
